<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Sandbox Host</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 20px; }
    input { width: 60%; padding: 5px 7px; }
    button { padding: 5px 9px; cursor: pointer; }
    code { background: #f0f0f0; padding: 1px 5px; border-radius: 4px; }
    pre { background: #f0f0f0; padding: 8px; border-radius: 5px; }
    iframe { display: none; }
  </style>
</head>
<body>
  <h1>Sandbox demo</h1>
  <p>
    Обычная страница расширения встраивает <code>sandbox.html</code> в iframe
    и шлёт ему выражение через <code>postMessage</code>. Sandbox вычисляет его
    через <code>eval</code> (что запрещено CSP вне песочницы) и возвращает результат.
  </p>
  <p>
    <input id="expr" type="text" value="1 + 2 * 3" />
    <button id="run">Вычислить в sandbox</button>
  </p>
  <pre id="out"></pre>

  <iframe id="frame" src="sandbox.html"></iframe>

  <script src="sandbox-host.js"></script>
</body>
</html>
