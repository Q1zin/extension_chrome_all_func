<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Custom History Page</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 20px; }
    code { background: #f0f0f0; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>History (обычная страница)</h1>
  <p>
    Тоже обычная HTML-страница расширения. Чтобы заменить ею системную
    страницу истории — используй <code>chrome_url_overrides.history</code>
    (но помни: override может быть только один на расширение).
  </p>
</body>
</html>
